# /etc/nginx/sites-available/lk.biswakarmagold.com
# Only purpose: secure websocket for the web panel / Android softphone -> Asterisk (127.0.0.1:8088).
server {
    listen 80;
    server_name lk.biswakarmagold.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name lk.biswakarmagold.com;

    ssl_certificate     /etc/letsencrypt/live/lk.biswakarmagold.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.biswakarmagold.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { return 404; }
}
