[general]
; Media ports for Meta, staff browsers/apps and desk phones (open the same UDP range in ufw).
rtpstart=${RTP_START}
rtpend=${RTP_END}
strictrtp=yes
; ICE is needed for WebRTC (browsers / Android). Meta's trunk has ICE off per endpoint.
icesupport=yes
; never offer Docker bridge addresses as ICE candidates
ice_denylist=172.16.0.0/12
