; ===== Dialplan for the WhatsApp calling proof of concept =====
; Generated from /etc/asterisk-templates by entrypoint.sh. Do not edit inside the container.

[general]
static=yes
writeprotect=yes

[globals]
WA_NUMBER=${WA_BUSINESS_NUMBER}
EARLY_ANSWER=${EARLY_ANSWER}
RING_FIRST=${RING_FIRST_SECONDS}
RING_ALL=${RING_ALL_SECONDS}
RECORD_CALLS=${RECORD_CALLS}
; Phase 1: 1001 is the "assigned" staff member; 1001-1003 together are "all online staff".
FIRST_TARGET=PJSIP/1001
ALL_TARGETS=PJSIP/1001&PJSIP/1002&PJSIP/1003

; ---------- customer calls the business (Meta -> Asterisk) ----------
[from-whatsapp]
exten => _[+0-9].,1,NoOp(WhatsApp inbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(WACID=${PJSIP_HEADER(read,x-wa-meta-wacid)})
 same => n,Set(CDR(userfield)=wacid:${WACID})
 same => n,Log(NOTICE,WA-INBOUND wacid=${WACID} from=${CALLERID(num)} user=${PJSIP_HEADER(read,x-wa-meta-username)})
 same => n,GotoIf($["${EARLY_ANSWER}" = "yes"]?early)
 ; Default: keep the call ringing on the customer's phone until a staff member answers.
 same => n(ring),Gosub(record,s,1(in))
 same => n,Dial(${FIRST_TARGET},${RING_FIRST})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Dial(${ALL_TARGETS},${RING_ALL})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Log(NOTICE,WA-MISSED wacid=${WACID} from=${CALLERID(num)} status=${DIALSTATUS})
 same => n,Hangup(19)
 ; Test mode: answer at once (stops Meta's 30-60 s timer), play ringback, then ring staff.
 same => n(early),Answer()
 same => n,Wait(0.5)
 same => n,Gosub(record,s,1(in))
 same => n,Dial(${FIRST_TARGET},${RING_FIRST},r)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Dial(${ALL_TARGETS},${RING_ALL},r)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Log(NOTICE,WA-MISSED wacid=${WACID} from=${CALLERID(num)} status=${DIALSTATUS})
 same => n,Playback(vm-nobodyavail)
 same => n,Hangup(16)
 same => n(done),Hangup()

; ---------- staff phones ----------
[from-staff]
; Call a WhatsApp user: dial 91XXXXXXXXXX (12 digits) or +<country><number>.
; The customer must have granted call permission first.
exten => _91XXXXXXXXXX,1,Goto(wa-out,+${EXTEN},1)
exten => _+X.,1,Goto(wa-out,${EXTEN},1)
; Staff-to-staff test calls
exten => _100[1-3],1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
; Audio test without Meta: echo back whatever you say
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

[wa-out]
exten => _+X.,1,NoOp(WhatsApp outbound to ${EXTEN} by ${CALLERID(num)})
 same => n,Log(NOTICE,WA-OUTBOUND to=${EXTEN} staff=${CALLERID(num)})
 same => n,Set(CALLERID(num)=${WA_NUMBER})
 same => n,Gosub(record,s,1(out))
 same => n,Dial(PJSIP/whatsapp/sip:${EXTEN}@wa.meta.vc,60)
 same => n,Log(NOTICE,WA-OUTBOUND-END to=${EXTEN} status=${DIALSTATUS} cause=${HANGUPCAUSE})
 same => n,Hangup()

; ---------- recording (only the answered part of the call) ----------
[record]
exten => s,1,GotoIf($["${RECORD_CALLS}" != "yes"]?skip)
 same => n,Set(REC_FILE=${STRFTIME(${EPOCH},,%Y/%m/%d)}/${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,Set(CDR(recording)=${REC_FILE})
 same => n,MixMonitor(${REC_FILE},b)
 same => n(skip),Return()
