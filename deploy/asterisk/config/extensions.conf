; ===== WhatsApp calling dialplan (Phase 2: routed by the backend) =====
; Generated from /etc/asterisk-templates by entrypoint.sh. Do not edit inside the container.
;
; The backend decides who rings (private HTTP calls to ${BACKEND}/internal/calls/*, loopback + secret).
; Asterisk only carries the audio, rings the devices it is told to, and records answered calls.

[general]
static=yes
writeprotect=yes

[globals]
WA_NUMBER=${WA_BUSINESS_NUMBER}
BACKEND=${BACKEND_URL}
INTERNAL_SECRET=${CALLING_INTERNAL_SECRET}
RECORD_CALLS=${RECORD_CALLS}
; seconds to wait for at least one device to come online (e.g. phone woken by push) before ringing
DEVICE_WAIT=${DEVICE_WAIT_SECONDS}

#include generated/extensions_users.conf

; ---------- helpers ----------
; Set the secret header once per channel for func_curl calls to the backend
[curl-setup]
exten => s,1,GotoIf($["${CURL_READY}" = "1"]?done)
 same => n,Set(CURLOPT(httpheader)=X-Internal-Secret: ${INTERNAL_SECRET})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=6)
 same => n,Set(CURL_READY=1)
 same => n(done),Return()

; ARG1 = endpoints separated by ~, ARG2 = max seconds to wait for a registered device.
; Returns a Dial string with every registered device (web, Android, desk) of those endpoints.
[dial-list]
exten => s,1,Set(LOCAL(W)=0)
 same => n(build),Set(LOCAL(DS)=)
 same => n,Set(LOCAL(I)=1)
 same => n(next),Set(LOCAL(EP)=${CUT(ARG1,~,${I})})
 same => n,GotoIf($[${LEN(${EP})} = 0]?check)
 same => n,Set(LOCAL(I)=$[${I} + 1])
 same => n,Set(LOCAL(C)=${PJSIP_DIAL_CONTACTS(${EP})})
 same => n,GotoIf($[${LEN(${C})} = 0]?next)
 same => n,GotoIf($[${LEN(${DS})} = 0]?first)
 same => n,Set(LOCAL(DS)=${DS}&${C})
 same => n,Goto(next)
 same => n(first),Set(LOCAL(DS)=${C})
 same => n,Goto(next)
 same => n(check),GotoIf($[${LEN(${DS})} > 0 | ${W} >= ${ARG2}]?ret)
 same => n,Wait(1)
 same => n,Set(LOCAL(W)=$[${W} + 1])
 same => n,Goto(build)
 same => n(ret),Return(${DS})

; Runs on the answering channel (Dial U option) before the call is connected
[wa-answered]
exten => s,1,Gosub(curl-setup,s,1)
 same => n,Set(LOCAL(R)=${CURL(${BACKEND}/internal/calls/answered,callLogId=${ARG1}&endpoint=${URIENCODE(${CHANNEL(endpoint)})})})
 same => n,Return()

; Hangup handler on the customer/staff channel: report the result to the backend
[wa-hangup]
exten => s,1,GotoIf($["${CALLLOG}" = ""]?end)
 same => n,Gosub(curl-setup,s,1)
 same => n,Set(LOCAL(R)=${CURL(${BACKEND}/internal/calls/hangup,callLogId=${CALLLOG}&dialstatus=${DIALSTATUS}&answeredtime=${ANSWEREDTIME}&recfile=${URIENCODE(${REC_FILE})}&cause=${HANGUPCAUSE})})
 same => n(end),Return()

; ---------- customer calls the business (Meta -> Asterisk) ----------
[from-whatsapp]
exten => _[+0-9].,1,NoOp(WhatsApp inbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(WACID=${PJSIP_HEADER(read,x-wa-meta-wacid)})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(CDR(userfield)=wacid:${WACID})
 same => n,Ringing()
 same => n,Gosub(curl-setup,s,1)
 same => n,Set(ROUTE=${CURL(${BACKEND}/internal/calls/inbound-route,uniqueid=${URIENCODE(${UNIQUEID})}&wacid=${URIENCODE(${WACID})}&from=${URIENCODE(${CALLERID(num)})}&to=${URIENCODE(${EXTEN})})})
 same => n,Log(NOTICE,WA-INBOUND wacid=${WACID} from=${CALLERID(num)} route=${CUT(ROUTE,|,1)} calllog=${CUT(ROUTE,|,2)})
 same => n,GotoIf($["${CUT(ROUTE,|,1)}" = "ok"]?routed)
 ; Backend unreachable: ring every account for the full time (not logged)
 same => n,Log(WARNING,WA-INBOUND backend did not answer - ringing everyone)
 same => n,Gosub(users-fallback,s,1)
 same => n,Set(EPS1=)
 same => n,Set(T1=0)
 same => n,Set(EPS2=${GOSUB_RETVAL})
 same => n,Set(T2=50)
 same => n,Goto(start)
 same => n(routed),Set(CALLLOG=${CUT(ROUTE,|,2)})
 same => n,Set(EPS1=${CUT(ROUTE,|,3)})
 same => n,Set(T1=${CUT(ROUTE,|,4)})
 same => n,Set(EPS2=${CUT(ROUTE,|,5)})
 same => n,Set(T2=${CUT(ROUTE,|,6)})
 same => n,Set(CHANNEL(hangup_handler_push)=wa-hangup,s,1)
 same => n(start),Gosub(record,s,1(in))
 same => n,GotoIf($[${LEN(${EPS1})} = 0]?stage2)
 ; Stage 1: the assigned staff member's devices
 same => n,Gosub(dial-list,s,1(${EPS1},${DEVICE_WAIT}))
 same => n,Set(DS=${GOSUB_RETVAL})
 same => n,Set(LEFT=$[${T1} - (${EPOCH} - ${CALL_START})])
 same => n,GotoIf($[${LEN(${DS})} = 0 | ${LEFT} < 3]?stage2note)
 same => n,Dial(${DS},${LEFT},U(wa-answered^${CALLLOG}))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(stage2note),GotoIf($["${CALLLOG}" = ""]?stage2)
 same => n,Set(R=${CURL(${BACKEND}/internal/calls/stage-all,callLogId=${CALLLOG})})
 ; Stage 2: everyone (admins, superadmins, staff of this number), until the total time is used
 same => n(stage2),Gosub(dial-list,s,1(${EPS2},${DEVICE_WAIT}))
 same => n,Set(DS=${GOSUB_RETVAL})
 same => n,Set(LEFT=$[${T1} + ${T2} - (${EPOCH} - ${CALL_START})])
 same => n,GotoIf($[${LEN(${DS})} = 0 | ${LEFT} < 3]?nobody)
 same => n,Dial(${DS},${LEFT},U(wa-answered^${CALLLOG}))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(nobody),Log(NOTICE,WA-MISSED wacid=${WACID} from=${CALLERID(num)} status=${DIALSTATUS})
 same => n,Hangup(19)
 same => n(done),Hangup()

; ---------- staff devices ----------
[from-staff]
; Call a customer: the app dials chat-<chatId>; desk phones may dial 91XXXXXXXXXX or +<number>.
; The backend checks the user may call this chat and that the customer allowed calls.
exten => _chat-X.,1,Goto(wa-out,${EXTEN},1)
exten => _91XXXXXXXXXX,1,Goto(wa-out,${EXTEN},1)
exten => _+X.,1,Goto(wa-out,${EXTEN},1)
; Audio test without Meta: echo back whatever you say
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

[wa-out]
exten => _[+0-9c].,1,NoOp(WhatsApp outbound to ${EXTEN} by ${CHANNEL(endpoint)})
 same => n,Gosub(curl-setup,s,1)
 same => n,Set(R=${CURL(${BACKEND}/internal/calls/outbound-authorize,endpoint=${URIENCODE(${CHANNEL(endpoint)})}&target=${URIENCODE(${EXTEN})}&uniqueid=${URIENCODE(${UNIQUEID})})})
 same => n,GotoIf($["${CUT(R,|,1)}" != "ok"]?deny)
 same => n,Set(CALLLOG=${CUT(R,|,2)})
 same => n,Set(NUM=${CUT(R,|,3)})
 same => n,Log(NOTICE,WA-OUTBOUND to=${NUM} by=${CHANNEL(endpoint)} calllog=${CALLLOG})
 same => n,Set(CHANNEL(hangup_handler_push)=wa-hangup,s,1)
 same => n,Set(CALLERID(num)=${WA_NUMBER})
 same => n,Gosub(record,s,1(out))
 same => n,Dial(PJSIP/whatsapp/sip:${NUM}@wa.meta.vc,60,U(wa-answered^${CALLLOG}))
 same => n,Hangup()
 same => n(deny),Log(NOTICE,WA-OUTBOUND-DENIED by=${CHANNEL(endpoint)} to=${EXTEN}: ${CUT(R,|,2)})
 same => n,Hangup(21)

; ---------- recording (only the answered part of the call) ----------
[record]
exten => s,1,GotoIf($["${RECORD_CALLS}" != "yes"]?skip)
 same => n,Set(REC_FILE=${STRFTIME(${EPOCH},,%Y/%m/%d)}/${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,Set(CDR(recording)=${REC_FILE})
 same => n,MixMonitor(${REC_FILE},b)
 same => n(skip),Return()
