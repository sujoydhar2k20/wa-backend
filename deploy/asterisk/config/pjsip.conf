; ===== WhatsApp Business Calling over SIP (Meta) =====
; Based on Meta's "Asterisk using SIP" integration example, with these changes:
;   - Meta is identified by its published IP ranges (not by a header anyone could send).
;   - Staff accounts are generated per user by the backend (generated/pjsip_users.conf).
; Generated from /etc/asterisk-templates by entrypoint.sh. Do not edit inside the container.

[global]
type=global
user_agent=BJS-PBX
endpoint_identifier_order=ip,username,anonymous

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/var/lib/asterisk/certs/fullchain.pem
priv_key_file=/var/lib/asterisk/certs/privkey.pem
method=sslv23
verify_client=no
require_client_cert=no
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}
allow_reload=no

; Web panel / Android app: browsers connect with wss to nginx (lk.biswakarmagold.com/ws),
; nginx forwards plain ws to Asterisk's HTTP server on 127.0.0.1:8088 (see http.conf).
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---------- templates ----------
[sdes_endpoint](!)
type=endpoint
transport=transport-tls
disallow=all
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
media_use_received_transport=yes
media_encryption=sdes
media_encryption_optimistic=no
ice_support=no
dtmf_mode=rfc4733

; Staff on the web panel / Android app (WebRTC: DTLS-SRTP, ICE, Opus)
[webrtc_user](!)
type=endpoint
context=from-staff
disallow=all
allow=opus,ulaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733
send_pai=no

; Optional desk/Linphone account per user (TLS + SDES), enabled with user.sip.deskPhone
[desk_user](!,sdes_endpoint)
context=from-staff
allow=opus,ulaw,alaw
rewrite_contact=yes

[user_auth](!)
type=auth
auth_type=userpass

; Several devices per user (web + Android) may register at once; all of them ring.
[user_aor](!)
type=aor
max_contacts=5
remove_existing=no
remove_unavailable=yes
default_expiration=300
maximum_expiration=600
qualify_frequency=30

; ---------- staff accounts (written by the backend, one per active user) ----------
#include generated/pjsip_users.conf

; ---------- Meta SIP gateway (wa.meta.vc) ----------
[whatsapp](sdes_endpoint)
context=from-whatsapp
allow=opus,ulaw,alaw
aors=whatsapp
outbound_auth=whatsapp_auth
from_user=${WA_BUSINESS_NUMBER}
from_domain=${SIP_DOMAIN}
send_pai=no
trust_id_inbound=yes

[whatsapp]
type=aor
contact=sip:wa.meta.vc;transport=tls

[whatsapp_auth]
type=auth
auth_type=userpass
username=${WA_BUSINESS_NUMBER}
password=${META_SIP_PASSWORD}
realm=*

; Meta's SIP/webhook IP ranges (from Meta's integration examples page; keep up to date).
; Requests from any other address never reach the whatsapp endpoint.
[whatsapp_identify]
type=identify
endpoint=whatsapp
match=31.13.24.0/21
match=31.13.64.0/18
match=45.64.40.0/22
match=57.141.0.0/21
match=57.141.8.0/22
match=57.141.12.0/23
match=57.144.0.0/14
match=66.220.144.0/20
match=69.63.176.0/20
match=69.171.224.0/19
match=74.119.76.0/22
match=102.132.96.0/20
match=103.4.96.0/22
match=129.134.0.0/16
match=147.75.208.0/20
match=157.240.0.0/16
match=163.70.128.0/17
match=163.77.128.0/17
match=173.252.64.0/18
match=179.60.192.0/22
match=185.60.216.0/22
match=185.89.216.0/22
match=204.15.20.0/22
